<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Today</h1>
      <p class="sub" id="count">Nothing yet</p>
    </header>

    <form class="composer" id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit" aria-label="Add">+</button>
    </form>

    <ul class="list" id="list"></ul>

    <footer class="foot">
      <div class="filters" id="filters">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="done">Done</button>
      </div>
      <button class="clear" id="clear">Clear done</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
